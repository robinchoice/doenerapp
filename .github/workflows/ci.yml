name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ios-compile:
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify stable Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          test "$(xcodebuild -version | head -n 1)" = "Xcode 27.1"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "27.1"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Compile native iPhone and iPad app without signing
        working-directory: app
        run: flutter build ios --release --no-codesign

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Models
        working-directory: packages/doener_models
        run: dart pub get && dart analyze && dart test

      - name: Server
        working-directory: server
        env:
          TEST_DB_PORT: 5432
          TEST_DB_PASSWORD: postgres
        run: dart pub get && dart analyze && dart test

      # The CLI against the server in-process, then built once to check it compiles (README, „CLI“)
      - name: CLI
        working-directory: cli
        env:
          TEST_DB_PORT: 5432
          TEST_DB_PASSWORD: postgres
        run: dart pub get && dart analyze && dart test && mkdir -p build && dart compile exe bin/doener.dart -o build/doener

      - name: App
        working-directory: app
        run: flutter pub get && flutter analyze && flutter test
