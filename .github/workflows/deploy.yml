name: Deploy API + Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'packages/**'
      - 'app/**'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: robinchoice/doener-api

jobs:
  build-and-push:
    # Server ist ARM64 (Hetzner) — nativ auf ARM-Runner bauen, sonst "exec format error"
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          provenance: false
          build-args: |
            APP_VERSION=${{ github.sha }}
            GOOGLE_MAPS_WEB_KEY=${{ secrets.GOOGLE_MAPS_WEB_KEY }}
            SENTRY_DSN=${{ vars.SENTRY_DSN }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Coolify
        id: deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_UUID }}
        run: |
          # Zeigt Status + Antwort, statt Fehler wie `curl -f` zu verschlucken.
          coolify() {
            status=$(curl -s -o response.txt -w '%{http_code}' -H "Authorization: Bearer $COOLIFY_TOKEN" "$@")
            echo "HTTP $status: $(cat response.txt)"
            [ "$status" -lt 300 ]
          }
          # Coolify auf den konkreten Commit-SHA-Tag setzen (umgeht den 'latest'-Image-Cache,
          # der sonst das alte Image behält), dann force-deployen.
          coolify -X PATCH "https://coolify.pleasance.org/api/v1/applications/$APP_UUID" \
            -H "Content-Type: application/json" \
            -d "{\"docker_registry_image_tag\": \"${{ github.sha }}\"}"
          coolify -X POST "https://coolify.pleasance.org/api/v1/deploy?uuid=$APP_UUID&force=true"

          # Done means the public URL serves this commit, which also catches a proxy route lost on recreate.
          for _ in {1..60}; do
            revision=$(curl --silent --max-time 10 https://doener-api.pleasance.org/api/v1/health | jq -r '.revision // empty' 2>/dev/null || true)
            echo "Public revision: ${revision:-none}"
            if [ "$revision" = "${{ github.sha }}" ]; then
              echo deployed=true >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "https://doener-api.pleasance.org/api/v1/health does not serve ${{ github.sha }}" >&2
          exit 1

  # Photographs the public landing page (tool/screenshots.mjs) and commits docs/screenshots
  # to main when the pictures changed. [skip ci] keeps that commit from deploying again.
  screenshots:
    needs: build-and-push
    if: needs.build-and-push.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --prefix tool playwright
      - run: tool/node_modules/.bin/playwright install --with-deps chromium
      - run: node tool/screenshots.mjs https://doener-api.pleasance.org
      - name: Commit the screenshots to main
        run: |
          set -euo pipefail
          mv docs/screenshots "$RUNNER_TEMP/screenshots"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # main may have moved on since this commit, a rejected push starts over from the new main
          for _ in 1 2 3; do
            git fetch --depth 1 origin main
            git checkout -f -B main FETCH_HEAD
            rm -rf docs/screenshots
            cp -r "$RUNNER_TEMP/screenshots" docs/screenshots
            git add -- docs/screenshots
            git diff --cached --quiet && exit 0
            git commit -m "docs: retake the screenshots for ${GITHUB_SHA::7} [skip ci]"
            git push origin main && exit 0
          done
          exit 1

  # Tells pleasance.org that the app is live with fresh screenshots
  notify:
    needs: screenshots
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PLEASANCE_DISPATCH_TOKEN }}
    steps:
      - name: Send prototype-deployed to robinchoice/pleasance
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "No PLEASANCE_DISPATCH_TOKEN secret yet, skipping"
            exit 0
          fi
          gh api repos/robinchoice/pleasance/dispatches \
            -f event_type=prototype-deployed \
            -f "client_payload[slug]=${GITHUB_REPOSITORY#*/}" \
            -f "client_payload[sha]=$GITHUB_SHA"
