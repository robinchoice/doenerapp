name: Deploy API + Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'packages/**'
      - 'app/**'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: robinchoice/doener-api

jobs:
  build-and-push:
    # Server ist ARM64 (Hetzner) — nativ auf ARM-Runner bauen, sonst "exec format error"
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          provenance: false
          build-args: |
            APP_VERSION=${{ github.sha }}
            GOOGLE_MAPS_WEB_KEY=${{ secrets.GOOGLE_MAPS_WEB_KEY }}
            SENTRY_DSN=${{ vars.SENTRY_DSN }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_UUID }}
          WORKER_UUID: ${{ secrets.COOLIFY_WORKER_UUID }}
        run: |
          # Zeigt Status + Antwort, statt Fehler wie `curl -f` zu verschlucken.
          coolify() {
            status=$(curl -s -o response.txt -w '%{http_code}' -H "Authorization: Bearer $COOLIFY_TOKEN" "$@")
            echo "HTTP $status: $(cat response.txt)"
            [ "$status" -lt 300 ]
          }
          # Coolify auf den konkreten Commit-SHA-Tag setzen (umgeht den 'latest'-Image-Cache,
          # der sonst das alte Image behält), dann force-deployen.
          # API and worker run the same image.
          for uuid in "$APP_UUID" "$WORKER_UUID"; do
            coolify -X PATCH "https://coolify.pleasance.org/api/v1/applications/$uuid" \
              -H "Content-Type: application/json" \
              -d "{\"docker_registry_image_tag\": \"${{ github.sha }}\"}"
            coolify -X POST "https://coolify.pleasance.org/api/v1/deploy?uuid=$uuid&force=true"
          done

          # Done means the public URL serves this commit, which also catches a proxy route lost on recreate.
          for _ in {1..60}; do
            revision=$(curl --silent --max-time 10 https://doener-api.pleasance.org/api/v1/health | jq -r '.revision // empty' 2>/dev/null || true)
            echo "Public revision: ${revision:-none}"
            [ "$revision" = "${{ github.sha }}" ] && exit 0
            sleep 10
          done
          echo "https://doener-api.pleasance.org/api/v1/health does not serve ${{ github.sha }}" >&2
          exit 1
