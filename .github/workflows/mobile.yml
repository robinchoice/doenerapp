name: Mobile

# Android → AAB als Artefakt und in den internen Play-Test, dazu eine signierte APK
# zum direkten Verschicken an Tester; iOS → TestFlight.
# Beides bei jedem Push auf main, der die App ändert (öffentliches Repo, Minuten frei),
# dazu bei Tags `v*` und per workflow_dispatch.
# `gh workflow run Mobile -f platform=android` baut nur Android.

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [all, android]
        default: all
  push:
    branches: [main]
    tags: ['v*']
    paths: ['app/**', 'packages/**', '.github/workflows/mobile.yml']

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  ios:
    if: inputs.platform != 'android'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Neuestes Xcode wählen
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Wähle: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: ASC-API-Key ablegen
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      # Eindeutige, steigende Build-Nummer pro Lauf — TestFlight lehnt Duplikate ab.
      # Ohne Key stürzt das Google Maps SDK beim Öffnen der Karte ab — dann lieber gar nicht bauen.
      - name: Maps-Key ablegen
        working-directory: app
        env:
          KEY: ${{ secrets.GOOGLE_MAPS_IOS_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "Secret GOOGLE_MAPS_IOS_KEY fehlt"; exit 1; }
          echo "GOOGLE_MAPS_IOS_KEY=$KEY" > ios/Flutter/Secrets.xcconfig

      # Festes Development-Zertifikat fürs Archiv. Ohne legt Xcode pro Lauf ein neues an,
      # bis die Zertifikatsgrenze des Teams erreicht ist. Profile und Export bleiben automatisch.
      - name: Signing-Zertifikat installieren
        env:
          IOS_DEV_CERTIFICATE: ${{ secrets.IOS_DEV_CERTIFICATE }}
          IOS_DEV_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DEV_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$IOS_DEV_CERTIFICATE" ] || { echo "Secret IOS_DEV_CERTIFICATE fehlt"; exit 1; }
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$IOS_DEV_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/signing.p12" -P "$IOS_DEV_CERTIFICATE_PASSWORD" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Flutter-Build vorbereiten
        working-directory: app
        # Firebase on iOS uses the bundle-restricted Maps key, which also allows FCM registration.
        run: flutter build ios --release --no-codesign --dart-define=SENTRY_DSN=${{ vars.SENTRY_DSN }} --dart-define=FIREBASE_API_KEY=${{ secrets.GOOGLE_MAPS_IOS_KEY }} --build-number=$((GITHUB_RUN_NUMBER + 10))

      - name: Archive bauen
        working-directory: app/ios
        run: |
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}

      - name: Export & Upload zu TestFlight
        working-directory: app/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}

  # Only release tags reach the external testers: every build given to the
  # group „Erste Tester“ mails all of them. Other builds stay internal.
  testflight-release:
    needs: ios
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build an „Erste Tester“ geben und zur Beta-Prüfung einreichen
        working-directory: server
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          dart pub get
          dart run tool/testflight_release.dart $((GITHUB_RUN_NUMBER + 10))

  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # Repo variable PLAY_UPLOAD=true once the first bundle was uploaded by hand in the Play Console.
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' && vars.PLAY_UPLOAD == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Ohne Secrets wird mit Debug-Keys signiert (nur zum Testen, nicht für Play).
      - name: Upload-Keystore ablegen
        if: env.HAS_KEYSTORE == 'true'
        working-directory: app/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks
          cat > key.properties <<EOF
          storeFile=../upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: App Bundle bauen
        working-directory: app
        env:
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
        run: flutter build appbundle --release --dart-define=SENTRY_DSN=${{ vars.SENTRY_DSN }} --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_ANDROID_KEY }} --build-number=$((GITHUB_RUN_NUMBER + 10))

      - uses: actions/upload-artifact@v4
        with:
          name: doener-android-aab
          path: app/build/app/outputs/bundle/release/app-release.aab

      # Until Play testing works, testers install this APK by hand.
      - name: APK bauen
        working-directory: app
        env:
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
        run: flutter build apk --release --dart-define=SENTRY_DSN=${{ vars.SENTRY_DSN }} --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_ANDROID_KEY }} --build-number=$((GITHUB_RUN_NUMBER + 10))

      - uses: actions/upload-artifact@v4
        with:
          name: doener-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      # Play only accepts API uploads once the first bundle was uploaded by hand in the Play Console.
      - name: Upload zu Play (interner Test)
        if: env.HAS_KEYSTORE == 'true' && env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.robinchoice.doener
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
