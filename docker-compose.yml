# Local stack: API + web app on http://localhost:8080, Postgres on 127.0.0.1:5434 (not reachable from the network).
# Without SMTP_HOST, login codes are printed to the app log.
services:
  app:
    build:
      context: .
      args:
        - GOOGLE_MAPS_WEB_KEY=${GOOGLE_MAPS_WEB_KEY:-}
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - DB_HOST=db
      - DB_NAME=doener
      - DB_USER=doener
      - DB_PASSWORD=${DB_PASSWORD:-doener}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8080}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-Döner App <noreply@localhost>}
      - SIGNUP_OPEN=${SIGNUP_OPEN:-true}
      - SIGNUP_ALLOWLIST=${SIGNUP_ALLOWLIST:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=doener
      - POSTGRES_USER=doener
      - POSTGRES_PASSWORD=${DB_PASSWORD:-doener}
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doener -d doener"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
