<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>Lieblingsdöner – Sticker</title>
<!-- 65 mm square sticker, QR to https://doener-api.pleasance.org.
     Print shop: open as is and print to PDF (69 mm page incl. 2 mm bleed).
     A4 sheet: open with #a4 (12 stickers with cut marks). -->
<style>
@font-face { font-family: Bricolage; src: url(../../app/assets/fonts/BricolageGrotesque.ttf); font-weight: 200 800; font-stretch: 75% 100%; }
@page { size: 69mm 69mm; margin: 0; }
* { box-sizing: border-box; margin: 0; }
body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.sticker { width: 69mm; height: 69mm; padding: 2mm; background: #0E0D12; color: #F2F0EA; font-family: Bricolage, sans-serif; }
.inner { height: 100%; padding: 4.5mm 5mm; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 2mm; font-weight: 700; font-size: 4.2mm; letter-spacing: -.01em; }
.brand img { width: 7mm; height: 7mm; border-radius: 1.6mm; }
h1 { margin-top: 3mm; font-weight: 800; font-stretch: 80%; font-size: 6.6mm; line-height: 1.02; letter-spacing: -.02em; }
h1 em { font-style: normal; background: linear-gradient(45deg, #F6A94A, #F3BA4D, #D7C45B); -webkit-background-clip: text; background-clip: text; color: transparent; }
.bottom { margin-top: auto; display: flex; align-items: flex-end; gap: 3.5mm; }
.code { flex: none; width: 27mm; height: 27mm; padding: 2mm; border-radius: 2.5mm; background: #fff; }
.qr { display: block; width: 100%; height: 100%; }
.cta { font-size: 3.1mm; line-height: 1.25; color: #9A98A3; padding-bottom: .5mm; }
.cta b { display: block; color: #F3BA4D; font-weight: 700; font-size: 3.6mm; margin-bottom: 1mm; }
/* A4 sheet */
body.a4 .sheet { width: 210mm; height: 297mm; padding: 12mm 7.5mm; display: grid; grid-template-columns: repeat(3, 65mm); grid-auto-rows: 65mm; gap: 5mm; justify-content: center; align-content: start; }
body.a4 .sticker { width: 65mm; height: 65mm; padding: 0; border-radius: 4mm; outline: .2mm dashed #bbb; outline-offset: 1.5mm; }
</style>

</div>
<script>
if (location.hash === '#a4') {
  document.body.classList.add('a4');
  document.styleSheets[0].insertRule('@page { size: A4; margin: 0; }', document.styleSheets[0].cssRules.length);
  const sheet = document.querySelector('.sheet'), one = sheet.innerHTML;
  sheet.innerHTML = one.repeat(12);
}
