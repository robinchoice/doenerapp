name: doener_server
description: API server for the Döner app — also serves the Flutter web build.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  crypto: ^3.0.6
  dart_jsonwebtoken: ^3.4.1
  doener_models:
    path: ../packages/doener_models
  googleapis_auth: ^2.3.4
  http: ^1.4.0
  mailer: ^7.2.0
  mime: ^2.0.0
  postgres: ^3.5.6
  qr: ^4.0.0
  sentry: ^9.30.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
